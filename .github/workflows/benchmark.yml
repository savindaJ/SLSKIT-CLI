---
name: Calculate benchmarks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  package-size:
    name: Package size
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Read primary Node version
        id: node
        run: echo "version=$(yq eval '.primary_node_version' .github/test-matrix.yml)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install pinned npm version
        shell: bash
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Get dist size
        run: |
          npm run build:release
          du -sk dist | cut -f1 > .delta.distSize && echo "kb (Dist size)" >> .delta.distSize

      - name: Get production dependency size
        run: |
          npm prune --production
          du -sk node_modules | cut -f1 > .delta.packageSize && echo "kb (Package size)" >> .delta.packageSize

      - name: Get dependency count
        run: npm ls -a -p | wc -l | tr -d ' \n' > .delta.dependencyCount && echo " (Dependency count)" >> .delta.dependencyCount

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo ${{ github.event.number }} > ./pr_number

      - name: Upload deltas
        uses: actions/upload-artifact@v7
        with:
          name: delta-action-deltas
          retention-days: 7
          include-hidden-files: true
          path: |
            .delta.*
            pr_number
