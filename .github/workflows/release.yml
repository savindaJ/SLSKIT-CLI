---
name: Release

# On develop push with pending changesets (or an unpublished version commit):
# version → test → tag → npm publish → push commit + tag in a single run.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read primary Node version
        id: node
        run: echo "version=$(yq eval '.primary_node_version' .github/test-matrix.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install pinned npm version
        shell: bash
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Decide whether to release
        id: plan
        run: |
          set -euo pipefail

          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          if [[ "$pending" -gt 0 ]]; then
            echo "Pending changesets found; will version and release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "should_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to release"
            exit 0
          fi

          echo "Package version $version is not tagged yet; will release"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Apply pending changesets
        if: steps.plan.outputs.should_version == 'true'
        run: |
          set -euo pipefail
          npm run changeset:version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages"

      - name: Gate release on CI checks
        if: steps.plan.outputs.should_release == 'true'
        run: |
          npm run typecheck
          npm run licenses
          npm test

      - name: Tag, publish, and push
        if: steps.plan.outputs.should_release == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"

          npm run changeset:publish

          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
