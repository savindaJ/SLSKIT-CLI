---
name: Changeset

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read primary Node version
        id: node
        run: echo "version=$(yq eval '.primary_node_version' .github/test-matrix.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install pinned npm version
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: npm ci --no-audit

      # Advisory only. A pull request with no changeset releases nothing, which
      # is the right answer for docs and chores -- so this reports and never blocks.
      - name: Check whether this pull request releases anything
        continue-on-error: true
        run: npx changeset status --since=origin/${{ github.base_ref }}
