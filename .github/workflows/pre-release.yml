---
name: Prerelease

# Preview installs for pull requests via https://github.com/apps/pkg-pr-new
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prerelease:
    name: Prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read primary Node version
        id: node
        run: echo "version=$(yq eval '.primary_node_version' .github/test-matrix.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install pinned npm version
        shell: bash
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build project
        run: npm run build

      - name: Publish prerelease
        run: |
          set +e
          output=$(npm exec -- pkg-pr-new publish --previewVersion --bin 2>&1)
          status=$?
          echo "$output"
          if [[ $status -ne 0 ]] && echo "$output" | grep -q "pkg-pr-new is not installed"; then
            echo "::warning::Install https://github.com/apps/pkg-pr-new on this repository to enable preview publishes."
            exit 0
          fi
          exit $status
