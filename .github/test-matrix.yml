---
# Node.js versions tested on Linux in every PR's test matrix.
# The minimum version should stay aligned with package.json `engines.node`.
node_versions: ['18', '20', '22']

# Pin specific install versions for entries in `node_versions` / `primary_node_version`.
node_install_overrides: {}

# Additional operating systems added to the full test matrix on release branches.
extra_oses_on_release: ['macOS-latest', 'windows-2025']

# Operating systems added to EVERY PR's matrix (primary Node version only).
extra_oses_always: ['macOS-latest', 'windows-2025']

# The pinned version for single-version workflows and extra OS matrix entries.
primary_node_version: '20'
